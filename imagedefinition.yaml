# Microsoft Dev Box user customization file for local upload during creation.
# The system task is required because enabling WSL and installing machine-wide
# software require elevation. Portal validation will reject it when the Dev Box
# user is not an administrator and the project catalog has not preapproved it.
$schema: "1.0"
name: azure-support-hpc-workstation

tasks:
  - name: ~/powershell
    description: Install and configure Azure Support and HPC workstation tools
    parameters:
      command: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        $repositoryRawUrl = 'https://raw.githubusercontent.com/taumhanlon/devbox-customization/main'
        $setupRoot = 'C:\DevBoxSetup'
        $scriptsRoot = Join-Path $setupRoot 'scripts'
        $logsRoot = Join-Path $setupRoot 'Logs'
        New-Item -ItemType Directory -Path $scriptsRoot, $logsRoot -Force | Out-Null

        $scriptNames = @(
          'bootstrap-windows.ps1',
          'bootstrap-wsl.sh',
          'install-vscode-extensions.ps1',
          'post-install-validation.ps1'
        )
        foreach ($scriptName in $scriptNames) {
          $uri = "$repositoryRawUrl/scripts/$scriptName"
          $destination = Join-Path $scriptsRoot $scriptName
          Invoke-WebRequest -Uri $uri -OutFile $destination -UseBasicParsing
        }

        & (Join-Path $scriptsRoot 'bootstrap-windows.ps1') -SourceRoot $setupRoot
